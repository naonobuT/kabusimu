name: stock_simulator_kids
description: 中学生向け株式投資シミュレーター

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状態管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ナビゲーション
  go_router: ^14.2.7

  # ローカルDB
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # アニメーション
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # コード生成補助
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ユーティリティ
  intl: ^0.19.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/company_logos/
    - assets/images/characters/

  # fonts:  # NotoSansJP を追加する場合は以下を有効化
  #   - family: NotoSansJP
  #     fonts:
  #       - asset: assets/fonts/NotoSansJP/NotoSansJP-Regular.ttf
  #       - asset: assets/fonts/NotoSansJP/NotoSansJP-Bold.ttf
  #         weight: 700
